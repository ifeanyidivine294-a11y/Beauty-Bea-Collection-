
<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B51F63" />
      <stop offset="100%" stop-color="#92174F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <!-- Monogram BB Icon -->
  <g transform="translate(30, 25)">
    <circle cx="65" cy="65" r="58" fill="none" stroke="#B51F63" stroke-width="2.5" opacity="0.6"/>
    <circle cx="65" cy="65" r="54" fill="none" stroke="#17131B" stroke-width="1" opacity="0.3"/>
    
    <!-- First B (Berry) -->
    <path d="M 48 35 L 68 35 C 77 35, 84 41, 84 49 C 84 55, 80 60, 74 62 C 82 64, 88 71, 88 80 C 88 90, 80 97, 68 97 L 48 97 Z" 
          fill="none" stroke="url(#berryGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="58" y1="36" x2="58" y2="96" stroke="url(#berryGrad)" stroke-width="3"/>
    
    <!-- Interlocking Second B (Ink / White) -->
    <path d="M 62 43 L 78 43 C 85 43, 91 48, 91 55 C 91 60, 87 64, 82 66 C 89 68, 95 74, 95 82 C 95 90, 88 95, 78 95 L 62 95" 
          fill="none" stroke="#17131B" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
          
    <!-- Small Diamond Sparkle -->
    <path d="M 65 24 L 67 29 L 72 31 L 67 33 L 65 38 L 63 33 L 58 31 L 63 29 Z" fill="#B51F63"/>
  </g>

  <!-- Typography -->
  <g transform="translate(180, 50)">
    <text x="0" y="42" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="44" font-weight="600" letter-spacing="4" fill="#17131B">
      BEAUTY <tspan fill="#B51F63">BEA</tspan>
    </text>
    <text x="3" y="75" font-family="'Manrope', -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="9" fill="#77717A">
      COLLECTION
    </text>
    <line x1="160" y1="71" x2="330" y2="71" stroke="#EDE5E9" stroke-width="1.5" />
  </g>
</svg>